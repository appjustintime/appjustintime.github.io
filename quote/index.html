<style>:root {
  --site-bg: #ffffff;
  --site-alt: #f4f6f9;
  --site-card: #ffffff;
  --site-line: #e1e4ea;
  --site-text: #15171c;
  --site-muted: #646a7a;
  --site-primary: #2b66c4;
  --site-primary-dark: #1f4f9c;
  --site-primary-soft: #e8f0fc;
  --site-money: #0a7a5c;
  --site-warn: #94590a;
  --site-radius: 16px;
  --site-wrap: 1120px;
}
:where(.site-top,.site-foot) a{color:var(--site-primary);text-decoration:none}
.wrap{ max-width: var(--site-wrap); margin: 0 auto; padding: 0 20px; }
.btn{
  display: inline-block; padding: 13px 22px; border-radius: 12px;
  background: var(--site-primary); color: #fff; font-weight: 700; white-space: nowrap;
  border: 1px solid var(--site-primary); transition: background .15s;
}
.btn:hover{ background: var(--site-primary-dark); text-decoration: none; }
.btn-ghost{ background: transparent; color: var(--site-primary); }
.btn-ghost:hover{ background: var(--site-primary-soft); }
.btn-light{ background: #fff; color: var(--site-primary); border-color: #fff; }
.btn-light:hover{ background: var(--site-primary-soft); }
.btn-small{ padding: 8px 14px; font-size: 14px; border-radius: 10px; }
.site-top{ position: sticky; top: 0; z-index: 10; background: rgba(255,255,255,.94); backdrop-filter: blur(8px); border-bottom: 1px solid var(--site-line); }
.top-row{ display: flex; align-items: center; gap: 16px; min-height: 60px; }
.logo{ display: flex; align-items: center; gap: 10px; color: var(--site-text); }
.logo:hover{ text-decoration: none; }
.logo-mark{ display: block; flex: none; font-size: 26px; width: 1.2188em; height: 1.2066em; margin-right: calc(.28em - 10px); }
.logo-word{ display: inline-block; line-height: 1; font-size: 26px; font-weight: 780; letter-spacing: -.045em; color: var(--site-text); }
.logo-word em{ font-style: normal; color: var(--site-primary); }
.logo-ko{ padding-left: 10px; border-left: 1px solid var(--site-line); font-size: 14px; font-weight: 600; letter-spacing: .12em; color: var(--site-muted); line-height: 1; }
.site-nav{ margin-left: auto; display: flex; align-items: center; gap: 4px; }
.site-nav a:not(.btn){ color: var(--site-muted); padding: 8px 10px; border-radius: 8px; font-size: 15px; white-space: nowrap; }
.site-nav a:not(.btn):hover{ color: var(--site-text); background: var(--site-alt); text-decoration: none; }
.site-nav a[aria-current="page"]{ color: var(--site-text); font-weight: 700; }
.site-nav .btn{ margin-left: 8px; }
.nav-toggle, .nav-btn{ display: none; }
.site-top .wrap{ position: relative; }
@media (max-width: 860px){.nav-btn{
    display: block; margin-left: auto; width: 44px; height: 44px; border-radius: 10px; cursor: pointer; position: relative;
  }
.nav-toggle{
    display: block; position: absolute; right: 20px; top: 8px; width: 44px; height: 44px; margin: 0; opacity: 0; z-index: 2; cursor: pointer;
  }
.nav-toggle:focus-visible + .nav-btn{ outline: 3px solid #f0a020; outline-offset: 2px; }
.nav-toggle:checked + .nav-btn span{ background: transparent; }
.nav-toggle:checked + .nav-btn span::before{ top: 0; transform: rotate(45deg); }
.nav-toggle:checked + .nav-btn span::after{ top: 0; transform: rotate(-45deg); }
.nav-btn span, .nav-btn span::before, .nav-btn span::after{
    position: absolute; left: 10px; width: 20px; height: 2px; background: var(--site-text); content: ''; border-radius: 2px;
  }
.nav-btn span{ top: 21px; }
.nav-btn span::before{ top: -6px; left: 0; }
.nav-btn span::after{ top: 6px; left: 0; }
.site-nav{
    display: none; position: absolute; left: 0; right: 0; top: 60px; flex-direction: column; align-items: stretch;
    background: #fff; border-bottom: 1px solid var(--site-line); padding: 8px 20px 16px; gap: 0;
  }
.site-nav a:not(.btn){ padding: 12px 4px; font-size: 16px; border-bottom: 1px solid var(--site-alt); border-radius: 0; }
.site-nav .btn{ margin: 12px 0 0; text-align: center; }
.nav-toggle:checked ~ .site-nav{ display: flex; }}
.site-foot{ background: #10141b; color: #c3c8d2; padding: 40px 0 28px; margin-top: 0; }
.site-foot a{ color: #e3e8f0; }
.foot-row{ display: flex; justify-content: space-between; gap: 24px; flex-wrap: wrap; }
.foot-brand{ font-weight: 800; font-size: 18px; color: #fff; margin-bottom: 6px; }
.foot-brand span{ font-weight: 500; color: #8b93a3; font-size: 15px; margin-left: 4px; }
.foot-line{ font-size: 14px; margin-bottom: 4px; }
.site-foot .muted{ color: #8b93a3; }
.foot-links{ display: flex; gap: 16px; flex-wrap: wrap; font-size: 14px; }
.copy{ margin-top: 24px; padding-top: 16px; border-top: 1px solid #252b36; font-size: 13px; color: #8b93a3; }
.site-top{position:relative;z-index:6}</style>
